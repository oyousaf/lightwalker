[/Script/MoviePlayer.MoviePlayerSettings]
; Epic's animated Unreal Engine logo (Content/Movies/UE_Splash.mp4), played on launch while the game loads.
; Any key or button skips it. Play in Editor never plays startup movies; standalone -game launches skip it with
; -NoLoadingScreen, so in practice only packaged builds show it.
bWaitForMoviesToComplete=True
bMoviesAreSkippable=True
+StartupMovies=UE_Splash

[/Script/UnrealEd.ProjectPackagingSettings]
; The UI fonts (TTF files, not assets) in Content/Slate/Fonts.
+DirectoriesToAlwaysStageAsUFS=(Path="Slate")
; Everything the code loads by name (models, UI art, music and sound effects), which the cooker can't find by itself.
+DirectoriesToAlwaysCook=(Path="/Game/Enemies")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Hero")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
; The Path is opened by name, so the cooker has to be told about its map.
+MapsToCook=(FilePath="/Game/Maps/L_Arena")
+MapsToCook=(FilePath="/Game/Maps/L_Path")
